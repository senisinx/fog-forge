<!doctype html>
<!-- Source of img/og.jpg, the picture shown in link previews (Discord, X, ...).
     Render at 1200x630: see README, "Link preview". Same look as the start page: the match under fog, mist and amber. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62% 125%; src: url(../fonts/archivo-latin-wdth-normal.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; }
body { position: relative; overflow: hidden; background: #0e1418; color: #d4dfdf; font-family: "Archivo", sans-serif; }
.pic { position: absolute; inset: 0; background: url(../img/match-rotten-fields.webp) no-repeat 0 50% / auto 100%; }
.pic::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(270deg, rgba(14, 20, 24, .95) 38%, rgba(14, 20, 24, 0) 75%),
              radial-gradient(40% 40% at 30% 70%, rgba(212, 223, 223, .18), transparent 70%); }
.brand { position: absolute; top: 44px; right: 56px; display: flex; align-items: center; gap: 12px; font-weight: 820; font-stretch: 125%; font-size: 26px; letter-spacing: .01em; text-transform: uppercase; color: #eef3f3; }
.brand img { width: 40px; height: 40px; }
.copy { position: absolute; right: 56px; bottom: 56px; width: 600px; }
h1 { font-weight: 820; font-stretch: 125%; font-size: 76px; line-height: .95; letter-spacing: -.015em; color: #eef3f3; }
p { margin-top: 22px; font-size: 25px; line-height: 1.35; }
.tools { display: flex; gap: 36px; margin-top: 26px; font-weight: 700; font-size: 22px; color: #eaa25d; }
.tools span { display: flex; align-items: center; gap: 10px; }
.tools img { width: 34px; height: 34px; }
</style>
</head>
<body>
<div class="pic"></div>
<div class="brand"><img src="../img/icon.svg" alt="">Fog Forge</div>
<div class="copy">
  <h1>Know the map.<br>Read the chat.</h1>
  <p>Two free Windows tools for Dead by Daylight.</p>
  <div class="tools"><span><img src="icons/fog-scout.svg" alt="">Fog Scout</span><span><img src="icons/fog-translate.svg" alt="">Fog Translate</span></div>
</div>
</body>
</html>
