<!doctype html>
<!-- Source of img/og.jpg, the picture shown in link previews (Discord, X, ...).
     Render at 1200x630: see README, "Link preview". Same look as the start page: paper, ink, one rust colour. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Big Shoulders Display"; font-weight: 100 900; src: url(../fonts/big-shoulders-display-latin-wght-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; }
body { background: #e9e5db; color: #14181a; overflow: hidden; position: relative; }
.top { position: absolute; left: 0; right: 0; top: 0; height: 68px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #14181a; }
.name { font: 800 38px/1 "Big Shoulders Display", sans-serif; letter-spacing: .03em; text-transform: uppercase; }
.mono { font: 500 19px/1.3 "JetBrains Mono", monospace; letter-spacing: .04em; text-transform: uppercase; color: #575e5b; }
.left { position: absolute; left: 48px; top: 68px; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 26px; padding-bottom: 6px; }
.left .mono { font-size: 17px; white-space: nowrap; }
h1 { font: 900 127px/.83 "Big Shoulders Display", sans-serif; text-transform: uppercase; }
h1 span { display: block; color: #b94f17; }
.right { position: absolute; left: 600px; right: 0; top: 68px; bottom: 0; border-left: 2px solid #14181a; display: grid; grid-template-rows: 1fr 1fr; }
.shot { position: relative; background: #000 no-repeat; }
.shot + .shot { border-top: 2px solid #14181a; }
.shot b { position: absolute; left: 0; bottom: 0; padding: 8px 16px 9px; background: #e9e5db; border-top: 2px solid #14181a; border-right: 2px solid #14181a; font: 800 30px/1 "Big Shoulders Display", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
.scout { background-image: url(../img/match-rotten-fields.webp); background-size: 1500px auto; background-position: -10px -150px; }
.translate { background-image: url(../img/translate-ingame.webp); background-size: 640px auto; background-position: 0 -4px; background-color: #150c12; }
</style>
</head>
<body>
<div class="top"><span class="name">Fog Forge</span><span class="mono">fogforge.app</span></div>
<div class="left">
  <h1>Know<br>the map.<span>Read<br>the chat.</span></h1>
  <p class="mono">Two free Windows tools for Dead by Daylight</p>
</div>
<div class="right">
  <div class="shot scout"><b>Fog Scout</b></div>
  <div class="shot translate"><b>Fog Translate</b></div>
</div>
</body>
</html>
