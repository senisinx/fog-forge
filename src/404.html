<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Fog Forge</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11171a">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
<!-- fonts:head -->
<style>
:root {
  color-scheme: dark;
  --ground: #11171a;
  --mist: #c9d6d6;
  --haze: #8a9c9f;
  --line: #2b383d;
  --ember: #e39a55;
  --ember-ink: #1a1109;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--mist); font: 400 1rem/1.6 var(--body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
.wrap { max-width: 78rem; min-height: 100vh; min-height: 100dvh; margin-inline: auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: .8rem; border-bottom: 1px solid var(--line); }
.mark { display: inline-flex; align-items: center; gap: .6rem; font: 800 1.35rem/1 var(--display); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
.mark img { width: 1.6rem; height: 1.6rem; }
main { flex: 1; display: grid; gap: 1.25rem; align-content: center; justify-items: start; padding-block: clamp(2rem, 8vw, 6rem); }
.code { margin: 0; font: 500 .8125rem/1 var(--mono); letter-spacing: .12em; color: var(--ember); }
h1 { margin: 0; font: 800 clamp(3rem, 10vw, 6.5rem)/.9 var(--display); text-transform: uppercase; overflow-wrap: anywhere; animation: emerge 1.4s var(--ease) backwards; }
@keyframes emerge { from { opacity: 0; filter: blur(22px); transform: translateX(-.15em); } }
main p { margin: 0; max-width: 46ch; font-size: 1.25rem; line-height: 1.4; color: var(--haze); }
.btn { display: inline-flex; align-items: center; padding: .7rem 1.1rem; border: 1px solid var(--ember); background: var(--ember); color: var(--ember-ink);
  font: 600 .9375rem/1.2 var(--body); text-decoration: none; transition: transform .2s var(--ease), box-shadow .3s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -8px rgba(227, 154, 85, .55); }
:lang(zh) { --body: "Instrument Sans", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; --display: "Big Shoulders Display", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
:lang(ja) { --body: "Instrument Sans", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; --display: "Big Shoulders Display", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif; }
:lang(ko) { --body: "Instrument Sans", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; --display: "Big Shoulders Display", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; }
:lang(zh) h1, :lang(ja) h1, :lang(ko) h1 { line-height: 1.15; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="mark" id="nf-logo" href="/"><img src="/img/icon.svg" alt="" width="26" height="26">Fog Forge</a></header>
  <main>
    <p class="code">404</p>
    <h1 id="nf-title">Page not found</h1>
    <p id="nf-text">This page does not exist, or it has moved.</p>
    <a class="btn" id="nf-home" href="/">To the start page</a>
  </main>
</div>
<!-- i18n:404 -->
</body>
</html>
